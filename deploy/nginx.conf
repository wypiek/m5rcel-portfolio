# nginx + PHP-FPM. Copy to /etc/nginx/sites-available/m5rcel, change
# server_name, the root path and the PHP-FPM socket to match your VPS, then:
#   ln -s /etc/nginx/sites-available/m5rcel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# For HTTPS, run `certbot --nginx -d example.com` afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Only public/ is served. app/, bin/ and cache/ stay out of reach.
    root /var/www/m5rcel/public;
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Optional, raises GitHub's rate limit:
        # fastcgi_param GITHUB_TOKEN "github_pat_...";
    }

    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|svg)$ {
        expires 1d;
    }

    location ~ /\. {
        deny all;
    }
}

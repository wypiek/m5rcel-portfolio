# Apache + mod_php (or PHP-FPM). Copy to /etc/apache2/sites-available/m5rcel.conf,
# change ServerName and the paths, then:
#   a2enmod headers && a2ensite m5rcel && systemctl reload apache2
# For HTTPS, run `certbot --apache -d example.com` afterwards.
# The Docker image uses this file as-is.

<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/m5rcel/public

    <Directory /var/www/m5rcel/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Optional, raises GitHub's rate limit:
    # SetEnv GITHUB_TOKEN "github_pat_..."

    ErrorLog ${APACHE_LOG_DIR}/m5rcel-error.log
    CustomLog ${APACHE_LOG_DIR}/m5rcel-access.log combined
</VirtualHost>
